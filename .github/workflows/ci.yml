# PR + main push: conventions gate, Mongo-backed quality (lint/types/test/build), blocking critical audit.
# Job names: `ci / conventions`, `ci / quality` (branch protection).

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conventions:
    name: conventions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    steps:
      # TODO: remove this exemption after PR #26 merges (open stack #23–#26 only).
      - name: Legacy exemption (PRs #23–#26)
        id: exempt
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          pr="$PR_NUMBER"
          if [[ "$pr" =~ ^(23|24|25|26)$ ]]; then
            echo "exempt=true" >> "$GITHUB_OUTPUT"
            echo "Skipping conventions (legacy open PR #${pr})."
          else
            echo "exempt=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Branch name (type/JIRA-ID)
        if: steps.exempt.outputs.exempt != 'true'
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          branch="$BRANCH"
          if ! [[ "$branch" =~ ^(feat|fix|chore|refactor|perf|docs|test|ci|hotfix)/[A-Z]+-[0-9]+$ ]]; then
            echo "Branch must match ^(feat|fix|chore|refactor|perf|docs|test|ci|hotfix)/[A-Z]+-[0-9]+$"
            echo "Example: feat/CWA-53"
            exit 1
          fi

      - name: Conventional PR title (types + scope)
        if: steps.exempt.outputs.exempt != 'true'
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            refactor
            perf
            docs
            test
            ci
            hotfix
          requireScope: true

      - name: Jira scope in PR title
        if: steps.exempt.outputs.exempt != 'true'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          node <<'NODE'
          const title = process.env.TITLE ?? '';
          const re =
            /^(feat|fix|chore|refactor|perf|docs|test|ci|hotfix)\(([A-Z]+-\d+)\)!?: .+/;
          if (!re.test(title)) {
            console.error(
              'PR title must be Conventional Commits with Jira scope, e.g. feat(CWA-53): summary or feat(CWA-53)!: breaking',
            );
            process.exit(1);
          }
          NODE

  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
    env:
      DATABASE_URL: mongodb://127.0.0.1:27017/crux_ci
      AUTH_SECRET: ci-auth-secret-min-32-chars-long-xxxx
      NEXTAUTH_SECRET: ci-auth-secret-min-32-chars-long-xxxx
      APP_ENV: ci
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Turbo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm db:generate

      - name: Lint, types, test
        run: pnpm exec turbo run lint check-types test --cache-dir=.turbo

      - name: Build
        run: pnpm exec turbo run build --cache-dir=.turbo

      - name: Dependency audit (critical)
        run: pnpm audit --audit-level=critical --prod

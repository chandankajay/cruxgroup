name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
    env:
      DATABASE_URL: mongodb://127.0.0.1:27017/crux_ci
      AUTH_SECRET: ci-auth-secret-min-32-chars-long-xxxx
      NEXTAUTH_SECRET: ci-auth-secret-min-32-chars-long-xxxx
      APP_ENV: ci
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Turbo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm db:generate

      - name: Lint and types
        run: pnpm exec turbo run lint check-types --cache-dir=.turbo

      - name: Build
        run: pnpm exec turbo run build --cache-dir=.turbo

      - name: Dependency audit (critical)
        run: pnpm audit --audit-level=critical --prod
